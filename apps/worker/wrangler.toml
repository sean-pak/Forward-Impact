name = "tpw-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# TODO(human): replace database_id values with the ids printed by
# `wrangler d1 create tpw_analytics` and `wrangler d1 create tpw_vault`.
[[d1_databases]]
binding = "DB"
database_name = "tpw_analytics"
migrations_dir = "migrations/analytics"
database_id = "550e1702-5f9c-47de-bce2-be075a9ef56a"

[[d1_databases]]
binding = "VAULT"
database_name = "tpw_vault"
migrations_dir = "migrations/vault"
database_id = "d15226b5-d5ed-4afc-86e1-14c5c74168c8"

[triggers]
crons = ["* * * * *"]

[vars]
MAILBOX_ADDRESS = "hello@seanpak.com"
ADMIN_EMAILS = "sean.mk.pak@gmail.com"
WORKER_PUBLIC_URL = "https://tpw-worker.sean-mk-pak.workers.dev"
WEB_URL = "https://forward-impact-seanpaks-projects.vercel.app"
# The real EIT locator holds real CDCR data and its client is not built. Never set this to "true" without TPW authorization.
REAL_LOCATOR_ENABLED = "false"
# Demo reset (POST /api/demo/reset) deletes everything, including the vault's audit log. Turn it on for the demo only.
DEMO_MODE = "true"
# The inbox that plays the CBO. Reset recreates this org and contact (the human's own test account).
DEMO_CBO_EMAIL = "sean-pak@bmore-designful.com"
DEMO_CBO_ORG = "Bmore Designful Collective"
# Programs the CBO org already runs, so the demo attendance sheet's program is recognized without an extra question.
DEMO_CBO_PROGRAMS = "Healing Circle"
